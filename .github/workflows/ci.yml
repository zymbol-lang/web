# The site has no build step, so nothing here compiles anything. What it does is
# run the invariants that are invisible in a browser and therefore rot silently:
# a page whose Markdown twin fell behind it, a source file with no licence, a
# catalog entry pointing at a file someone renamed.
#
# `main` is what GitHub Pages serves. Without this, a push publishes whatever it
# contains, correct or not.
#
# `tests/test_runner.mjs` and `tests/test_check.mjs` are not here: both diff the JS
# engine against the `zymbol` CLI, which would mean installing the Rust interpreter
# on every run. They stay local, pre-release checks. (`test_check.mjs` skips itself
# when the binary is absent, so adding it would only ever report a skip.)
#
# Plain Node, no npm install — web/ has no package.json (see README, "No build step").

name: CI

on:
  push:
    branches: [main, 'v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: .zyp reader and module resolver
        run: node tests/test_zyp.mjs

      - name: Playground file model (mounted vs open)
        run: node tests/test_filestore.mjs

      - name: Execution limits (TUI block exemption vs the runaway-loop guard)
        run: node tests/test_limits.mjs

      - name: Example pool integrity (catalog.json ↔ examples/)
        run: node tests/test_catalog.mjs

      - name: Manual code blocks
        run: node tests/test_manual.mjs

      - name: Markdown for agents (twins, llms.txt, robots.txt, Worker)
        run: node tests/test_markdown.mjs

      - name: Licences (AGPL on sources, CC BY-SA on manuals)
        run: node tests/test_licenses.mjs

      - name: Agent surfaces (skill digest, SKILL.md blocks, WebMCP tools)
        run: node tests/test_agents.mjs

      - name: Symbol dictionary (cards ↔ highlighter ↔ REFERENCE §21)
        run: node tests/test_symbols.mjs

      - name: Translations (completeness gate, derived langs.json, pre-paint tables)
        run: node tests/test_i18n_playground.mjs

      - name: Translations of index3 (completeness, page ↔ catalogue, pre-paint block)
        run: node tests/test_i18n_atlas.mjs

      # Needs a browser, because the hover maps pointer positions to source lines by
      # arithmetic over the laid-out line height. GitHub's ubuntu runners ship Chrome;
      # the test says so and passes if one is ever missing.
      - name: Reading help in a real browser (hover cards, problems strip)
        run: node tests/test_playground_dom.mjs

      # Also a browser, and for the same kind of reason: a block that spills off a 360px
      # screen, or a picker that re-labels half the page, is a laid-out box and a live DOM.
      - name: index3 on a phone (layout at 360px, language switch in place)
        run: node tests/test_atlas_dom.mjs
